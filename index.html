<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    .card { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    .mb-20 { margin-bottom: 20px; }
    input, select, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; background: #4CAF50; color: white; border: none; }
    button:hover { background: #45a049; }
    .hidden { display: none; }
    .tabs { margin-bottom: 20px; }
    .tabs button { margin-right: 10px; padding: 10px 20px; }
  </style>
</head>
<body>

  <h1>Aplikasi Kasir</h1>

  <div class="tabs">
    <button onclick="showTab('menu')">Menu</button>
    <button onclick="showTab('meja')">Meja</button>
  </div>

  <div id="menu" class="tab-content"></div>
  <div id="meja" class="tab-content hidden"></div>

<script>
function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.getElementById(tab).classList.remove('hidden');
  
  if(tab === 'menu') renderMenu();
  if(tab === 'meja') renderMeja();
}

function renderMenu() {
  const container = document.getElementById('menu');
  container.innerHTML = `
    <div class="card">
      <h2>📋 Kelola Menu</h2>
      <div id="editForm">
        <h3>Edit Menu</h3>
        <div class="flex mb-20">
          <input type="text" id="editNama" placeholder="Nama Menu">
          <input type="number" id="editHarga" placeholder="Harga">
          <select id="editTipe">
            <option value="Food">Food</option>
            <option value="Beverage">Beverage</option>
          </select>
          <select id="editSubKategori">
            <option value="Minuman Ringan">Minuman Ringan</option>
            <option value="Kopi">Kopi</option>
          </select>
        </div>
        <button onclick="simpanEdit()">Simpan</button>
      </div>
    </div>
  `;

  // Event listener Enter biar bisa pindah kolom
  document.getElementById('editNama').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('editHarga').focus();
    }
  });

  document.getElementById('editHarga').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('editTipe').focus();
    }
  });

  document.getElementById('editTipe').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('editSubKategori').focus();
    }
  });

  document.getElementById('editSubKategori').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      simpanEdit();
    }
  });
}

function simpanEdit() {
  alert('Data disimpan!');
  document.getElementById('editNama').value = '';
  document.getElementById('editHarga').value = '';
  document.getElementById('editNama').focus();
}

function renderMeja() {
  const container = document.getElementById('meja');
  container.innerHTML = `
    <div class="card">
      <h2>🪑 Kelola Meja</h2>
      <p>Konten meja di sini</p>
    </div>
  `;
}

// Load awal
renderMenu();
</script>

</body>
</html>
