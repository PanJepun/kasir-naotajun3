<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Naotajun3</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
 .navbar { background: #333; padding: 10px; display: flex; gap: 10px; }
 .navbar button { background: #555; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
 .navbar button.active,.navbar button:hover { background: #4CAF50; }

 .container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h2 { text-align: center; margin-top: 0; }

 .page { display: none; }
 .page.active { display: block; }

 .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
 .tab { padding: 10px 15px; background: #e0e0e0; border-radius: 5px; cursor: pointer; }
 .tab.active { background: #4CAF50; color: white; }
 .meja { display: none; }
 .meja.active { display: block; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background: #f0f0f0; }
  input, select, button { padding: 8px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
  button { background: #4CAF50; color: white; border: none; cursor: pointer; }
  button:hover { background: #45a049; }
 .btn-danger { background: #f44336; }
 .btn-danger:hover { background: #d32f2f; }
 .summary { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
</style>
</head>
<body>

<div class="navbar">
  <button class="navbtn active" onclick="showPage('kasir')">Kasir</button>
  <button class="navbtn" onclick="showPage('menu')">Menu</button>
  <button class="navbtn" onclick="showPage('laporan')">Laporan</button>
</div>

<div class="container">

  <!-- Halaman Kasir -->
  <div id="kasir" class="page active">
    <h2>Kasir Naotajun3</h2>
    <div class="tabs" id="tabs"></div>
    <div id="mejaContainer"></div>
  </div>

  <!-- Halaman Menu -->
  <div id="menu" class="page">
    <h2>Manajemen Menu</h2>
    <p>Halaman untuk tambah/edit menu. Bisa dikembangkan nanti.</p>
  </div>

  <!-- Halaman Laporan -->
  <div id="laporan" class="page">
    <h2>Laporan Penjualan</h2>
    <p>Halaman laporan. Bisa dikembangkan nanti.</p>
  </div>

</div>

<script>
let mejaList = [
  {id: 1, nama: "Meja 1", items: [], diskonPersen: 0, ppnPersen: 10},
  {id: 2, nama: "Meja 2", items: [], diskonPersen: 0, ppnPersen: 10},
  {id: 3, nama: "Meja 3", items: [], diskonPersen: 0, ppnPersen: 10}
];

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');

  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function init() {
  renderTabs();
  showTab(1);
}

function renderTabs() {
  let tabsDiv = document.getElementById('tabs');
  tabsDiv.innerHTML = '';
  mejaList.forEach(meja => {
    let btn = document.createElement('div');
    btn.className = 'tab';
    btn.innerText = meja.nama;
    btn.onclick = () => showTab(meja.id);
    tabsDiv.appendChild(btn);
  });
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', mejaList[i].id === id);
  });
  document.querySelectorAll('.meja').forEach(el => el.classList.remove('active'));
  document.getElementById('meja' + id).classList.add('active');
}

function renderMeja() {
  let container = document.getElementById('mejaContainer');
  container.innerHTML = '';
  mejaList.forEach(meja => {
    let div = document.createElement('div');
    div.id = 'meja' + meja.id;
    div.className = 'meja';
    div.innerHTML = `
      <h3>${meja.nama}</h3>
      <input type="text" id="nama${meja.id}" placeholder="Nama Menu">
      <input type="number" id="harga${meja.id}" placeholder="Harga">
      <input type="number" id="qty${meja.id}" placeholder="Qty" value="1">
      <button onclick="tambahItem(${meja.id})">Tambah</button>

      <table>
        <thead>
          <tr><th>Menu</th><th>Harga</th><th>Qty</th><th>Subtotal</th><th>Aksi</th></tr>
        </thead>
        <tbody id="tbody${meja.id}"></tbody>
      </table>

      <div class="summary">
        Diskon %: <input type="number" id="diskon${meja.id}" value="${meja.diskonPersen}" onchange="updateDiskon(${meja.id})">
        PPN %: <input type="number" id="ppn${meja.id}" value="${meja.ppnPersen}" onchange="updatePPN(${meja.id})">
        <div id="total${meja.id}"></div>
        <button onclick="cetakStruk(${meja.id})">Cetak Struk</button>
        <button class="btn-danger" onclick="resetMeja(${meja.id})">Reset Meja</button>
      </div>
    `;
    container.appendChild(div);
    renderItems(meja.id);
  });
}

function tambahItem(id) {
  let meja = mejaList.find(m => m.id === id);
  let nama = document.getElementById('nama' + id).value;
  let harga = parseFloat(document.getElementById('harga' + id).value);
  let qty = parseInt(document.getElementById('qty' + id).value);
  if(!nama || isNaN(harga) || isNaN(qty)) return alert('Isi semua field');
  meja.items.push({nama, harga, qty});
  renderItems(id);
  document.getElementById('nama' + id).value = '';
  document.getElementById('harga' + id).value = '';
  document.getElementById('qty' + id).value = '1';
}

function renderItems(id) {
  let meja = mejaList.find(m => m.id === id);
  let tbody = document.getElementById('tbody' + id);
  tbody.innerHTML = '';
  let subtotal = 0;
  meja.items.forEach((item, i) => {
    let sub = item.harga * item.qty;
    subtotal += sub;
    tbody.innerHTML += `
      <tr>
        <td>${item.nama}</td>
        <td>Rp${item.harga.toLocaleString('id-ID')}</td>
        <td>${item.qty}</td>
        <td>Rp${sub.toLocaleString('id-ID')}</td>
        <td><button class="btn-danger" onclick="hapusItem(${id}, ${i})">Hapus</button></td>
      </tr>
    `;
  });
  hitungTotal(id, subtotal);
}

function hapusItem(id, index) {
  mejaList.find(m => m.id === id).items.splice(index, 1);
  renderItems(id);
}

function updateDiskon(id) {
  mejaList.find(m => m.id === id).diskonPersen = parseFloat(document.getElementById('diskon' + id).value) || 0;
  renderItems(id);
}

function updatePPN(id) {
  mejaList.find(m => m.id === id).ppnPersen = parseFloat(document.getElementById('ppn' + id).value) || 0;
  renderItems(id);
}

function hitungTotal(id, subtotal) {
  let meja = mejaList.find(m => m.id === id);
  let diskonRp = subtotal * (meja.diskonPersen / 100);
  let setelahDiskon = subtotal - diskonRp;
  let ppnRp = setelahDiskon * (meja.ppnPersen / 100);
  let total = setelahDiskon + ppnRp;
  document.getElementById('total' + id).innerHTML = `
    Subtotal: Rp${subtotal.toLocaleString('id-ID')}<br>
    Diskon: -Rp${diskonRp.toLocaleString('id-ID')}<br>
    PPN: Rp${ppnRp.toLocaleString('id-ID')}<br>
    <b>TOTAL: Rp${total.toLocaleString('id-ID')}</b>
  `;
}

function cetakStruk(id) {
  let meja = mejaList.find(m => m.id === id);
  let subtotal = meja.items.reduce((a, b) => a + b.harga * b.qty, 0);
  let diskonRp = subtotal * (meja.diskonPersen / 100);
  let setelahDiskon = subtotal - diskonRp;
  let ppnRp = setelahDiskon * (meja.ppnPersen / 100);
  let total = setelahDiskon + ppnRp;
  let waktu = new Date().toLocaleString('id-ID');

  let struk = `

        KASIR NAOTAJUN3

Waktu : ${waktu}

No Menu Qty Total

`;
  meja.items.forEach((item, i) => {
    let nama = item.nama.length > 12? item.nama.substring(0, 12) : item.nama;
    nama = nama.padEnd(12, ' ');
    let qty = String(item.qty).padStart(3, ' ');
    let totalItem = String((item.harga * item.qty).toLocaleString('id-ID')).padStart(8, ' ');
    struk += `${i+1}. ${nama} ${qty} Rp${totalItem}\n`;
  });
  struk += `--------------------------------
Subtotal : Rp${subtotal.toLocaleString('id-ID')}
Diskon ${meja.diskonPersen}% : -Rp${diskonRp.toLocaleString('id-ID')}
PPN ${meja.ppnPersen}% : Rp${ppnRp.toLocaleString('id-ID')}

TOTAL : Rp${total.toLocaleString('id-ID')}

     Terima Kasih :)
`;
  let printWindow = window.open('', '', 'height=600,width=400');
  printWindow.document.write('<pre style="font-family:monospace; font-size:12px;">' + struk + '</pre>');
  printWindow.document.close();
  printWindow.print();
}

function resetMeja(id) {
  if(confirm('Yakin reset meja ini?')) {
    mejaList.find(m => m.id === id).items = [];
    renderItems(id);
  }
}

init();
renderMeja();
</script>
</body>
</html>
