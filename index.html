<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kasir Sederhana</title>
<style>
body { font-family: Arial; padding: 20px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
button { padding: 8px 12px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>

<h2>Kasir Sederhana</h2>

<input type="text" id="nama" placeholder="Nama Barang">
<input type="number" id="harga" placeholder="Harga">
<input type="number" id="qty" value="1" placeholder="Qty">
<button onclick="tambah()">Tambah</button>
<button onclick="simpan()">Simpan</button>

<h3>Keranjang</h3>
<table id="tabel">
<thead><tr><th>Nama</th><th>Harga</th><th>Qty</th><th>Total</th></tr></thead>
<tbody></tbody>
</table>
<h3>Total: Rp<span id="total">0</span></h3>

<h3>Laporan</h3>
Dari: <input type="date" id="dari">
Sampai: <input type="date" id="sampai">
<button onclick="printLaporan()">Print</button>

<script>
let keranjang = [];
let penjualan = JSON.parse(localStorage.getItem('penjualan') || '[]');

function render() {
  let tbody = document.querySelector('#tabel tbody');
  tbody.innerHTML = '';
  let total = 0;
  keranjang.forEach(i => {
    let sub = i.harga * i.qty;
    total += sub;
    tbody.innerHTML += `<tr><td>${i.nama}</td><td>${i.harga}</td><td>${i.qty}</td><td>${sub}</td></tr>`;
  });
  document.getElementById('total').innerText = total;
}

function tambah() {
  let nama = document.getElementById('nama').value;
  let harga = parseInt(document.getElementById('harga').value);
  let qty = parseInt(document.getElementById('qty').value);
  if(!nama ||!harga) return alert('Isi nama dan harga');
  keranjang.push({nama, harga, qty});
  render();
}

function simpan() {
  if(keranjang.length === 0) return alert('Keranjang kosong');
  let total = keranjang.reduce((s,i) => s + i.harga*i.qty, 0);
  penjualan.push({tanggal: new Date().toLocaleString('id-ID'), items: keranjang, total});
  localStorage.setItem('penjualan', JSON.stringify(penjualan));
  keranjang = [];
  render();
  alert('Tersimpan!');
}

function printLaporan() {
  let dari = document.getElementById('dari').value;
  let sampai = document.getElementById('sampai').value;
  if(!dari ||!sampai) return alert('Pilih tanggal');

  let data = penjualan.filter(p => {
    let tgl = new Date(p.tanggal.split(',')[0].split('/').reverse().join('-'));
    return tgl >= new Date(dari) && tgl <= new Date(sampai);
  });

  if(data.length === 0) return alert('Tidak ada data');

  let totalOmzet = data.reduce((s,p) => s + p.total, 0);

  let html = `
  <html>
  <head><title>Laporan</title></head>
  <body>
    <h2>Laporan ${dari} s/d ${sampai}</h2>
    <p>Total Omzet: Rp${totalOmzet}</p>
    <button onclick="window.print()">Print</button>
    <script>window.onload=()=>window.print();</script>
  </body>
  </html>`;

  let win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}
</script>

</body>
</html>
