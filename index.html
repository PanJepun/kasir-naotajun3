<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Naotajun</title>
<style>
:root {
  --primary: #2196f3;
  --bg: #f5f5f5;
  --card: #fff;
  --text: #333;
}
[data-theme="green"] { --primary: #4caf50; }
[data-theme="red"] { --primary: #f44336; }
[data-theme="blue"] { --primary: #2196f3; }
[data-theme="dark"] { --primary: #607d8b; --bg: #1a1a1a; --card: #2d2d2d; --text: #fff; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
header { background: var(--primary); color: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 20px; }
.theme-selector { display: flex; gap: 8px; margin: 15px 20px; align-items: center; }
.theme-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
.theme-dot.green { background: #4caf50; }
.theme-dot.red { background: #f44336; }
.theme-dot.blue { background: #2196f3; }
.theme-dot.dark { background: #607d8b; }

nav { display: flex; gap: 5px; background: #fff; padding: 0 20px; border-bottom: 2px solid #eee; overflow-x: auto; }
nav button { padding: 12px 20px; border: none; background: none; cursor: pointer; white-space: nowrap; color: var(--text); }
nav button.active { border-bottom: 3px solid var(--primary); color: var(--primary); font-weight: bold; }

.container { padding: 20px; max-width: 1200px; margin: 0 auto; }
.card { background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
button { background: var(--primary); color: #fff; border: none; cursor: pointer; }
button:hover { opacity: 0.9; }
.btn-danger { background: #f44336; }
.btn-warning { background: #ff9800; }
.btn-success { background: #4caf50; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
th { background: var(--primary); color: #fff; }
tr:hover { background: rgba(0,0,0,0.05); }
.text-center { text-align: center; }
.flex { display: flex; gap: 10px; flex-wrap: wrap; }
.mb-20 { margin-bottom: 20px; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #fff; }
.badge-food { background: #4caf50; }
.badge-beverage { background: #2196f3; }
.hidden { display: none; }
.edit-form { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #ddd; }
</style>
</head>
<body data-theme="blue">

<header>
  <h1>🍽️ Kasir Naotajun</h1>
</header>

<div class="theme-selector">
  <span>Pilih Tema:</span>
  <div class="theme-dot green" onclick="setTheme('green')"></div>
  <div class="theme-dot red" onclick="setTheme('red')"></div>
  <div class="theme-dot blue" onclick="setTheme('blue')"></div>
  <div class="theme-dot dark" onclick="setTheme('dark')"></div>
</div>

<nav>
  <button class="nav-btn active" onclick="showTab('meja')">🪑 Meja</button>
  <button class="nav-btn" onclick="showTab('menu')">📋 Menu</button>
  <button class="nav-btn" onclick="showTab('kasir')">💰 Kasir</button>
  <button class="nav-btn" onclick="showTab('laporan')">📊 Laporan</button>
  <button class="nav-btn" onclick="showTab('backup')">💾 Backup</button>
</nav>

<div class="container">
  <div id="meja" class="tab-content"></div>
  <div id="menu" class="tab-content hidden"></div>
  <div id="kasir" class="tab-content hidden"></div>
  <div id="laporan" class="tab-content hidden"></div>
  <div id="backup" class="tab-content hidden"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('kasirData')) || {
  meja: [],
  menu: [],
  transaksi: []
};
let editId = null;

function setTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
}
document.body.setAttribute('data-theme', localStorage.getItem('theme') || 'blue');

function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tab).classList.remove('hidden');
  event.target.classList.add('active');

  if(tab === 'meja') renderMeja();
  if(tab === 'menu') renderMenu();
  if(tab === 'kasir') renderKasir();
  if(tab === 'laporan') renderLaporan();
  if(tab === 'backup') renderBackup();
}

function save() {
  localStorage.setItem('kasirData', JSON.stringify(data));
}

// ===== MEJA MODULE =====
function renderMeja() {
  const container = document.getElementById('meja');
  container.innerHTML = `
    <div class="card">
      <h2>🪑 Kelola Meja</h2>
      <div class="flex mb-20">
        <input type="text" id="namaMeja" placeholder="Nama Meja">
        <button onclick="tambahMeja()">+ Tambah Meja</button>
      </div>
      <table>
        <thead>
          <tr><th>No</th><th>Nama Meja</th><th>Status</th><th>Aksi</th></tr>
        </thead>
        <tbody id="listMeja"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('listMeja');
  if(data.meja.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center">Belum ada meja. Tambah dulu!</td></tr>`;
    return;
  }
  tbody.innerHTML = data.meja.map((m, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${m.nama}</td>
      <td><span class="badge" style="background:${m.status==='terisi'?'#ff9800':'#4caf50'}">${m.status || 'Kosong'}</span></td>
      <td><button class="btn-danger" onclick="hapusMeja(${m.id})">Hapus</button></td>
    </tr>
  `).join('');
}

function tambahMeja() {
  const nama = document.getElementById('namaMeja').value.trim();
  if(!nama) return alert('Isi nama meja!');
  data.meja.push({id: Date.now(), nama, status: 'kosong'});
  save();
  renderMeja();
  document.getElementById('namaMeja').value = '';
}

function hapusMeja(id) {
  if(!confirm('Hapus meja ini?')) return;
  data.meja = data.meja.filter(m => m.id!== id);
  save();
  renderMeja();
}

// ===== MENU MODULE =====
function renderMenu() {
  const container = document.getElementById('menu');
  container.innerHTML = `
    <div class="card">
      <h2>📋 Kelola Menu</h2>

      <div id="editForm" class="edit-form hidden">
        <h3>Edit Menu</h3>
        <div class="flex mb-20">
          <input type="text" id="editNama" placeholder="Nama Menu">
          <input type="text" id="editHarga" placeholder="Harga">
          <select id="editTipe">
            <option value="Food">Food</option>
            <option value="Beverage">Beverage</option>
          </select>
          <select id="editSubKategori">
            <option value="Makanan Berat">Makanan Berat</option>
            <option value="Camilan">Camilan</option>
            <option value="Minuman Ringan">Minuman Ringan</option>
            <option value="Minuman Keras">Minuman Keras</option>
          </select>
        </div>
        <button class="btn-success" onclick="simpanEdit()">Simpan</button>
        <button class="btn-warning" onclick="batalEdit()">Batal</button>
      </div>

      <div class="flex mb-20">
        <input type="text" id="namaMenu" placeholder="Nama Menu">
        <input type="text" id="hargaMenu" placeholder="Harga contoh: 45000">
        <select id="tipeMenu">
          <option value="Food">Food</option>
          <option value="Beverage">Beverage</option>
        </select>
        <select id="subKategoriMenu">
          <option value="Makanan Berat">Makanan Berat</option>
          <option value="Camilan">Camilan</option>
          <option value="Minuman Ringan">Minuman Ringan</option>
          <option value="Minuman Keras">Minuman Keras</option>
        </select>
        <button onclick="tambahMenu()">+ Tambah Menu</button>
      </div>

      <div class="flex mb-20">
        <button onclick="filterMenu('All')" class="btn-success">All</button>
        <button onclick="filterMenu('Food')">Food</button>
        <button onclick="filterMenu('Beverage')">Beverage</button>
      </div>

      <table>
        <thead>
          <tr><th>No</th><th>Nama Menu</th><th>Tipe</th><th>Sub Kategori</th><th>Harga</th><th>Aksi</th></tr>
        </thead>
        <tbody id="listMenu"></tbody>
      </table>
    </div>
  `;
  filterMenu('All');
}

let filterAktif = 'All';
function filterMenu(tipe) {
  filterAktif = tipe;
  const tbody = document.getElementById('listMenu');
  let dataFilter = tipe === 'All'
? data.menu
    : data.menu.filter(m => (m.tipe || 'Food') === tipe);

  if(dataFilter.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center">Belum ada menu ${tipe}</td></tr>`;
    return;
  }

  tbody.innerHTML = dataFilter.map((m, i) => {
    let tipeMenu = m.tipe || 'Food';
    let subKat = m.subKategori || 'Makanan Berat';
    return `
    <tr>
      <td>${i+1}</td>
      <td>${m.nama}</td>
      <td><span class="badge ${tipeMenu==='Food'?'badge-food':'badge-beverage'}">${tipeMenu}</span></td>
      <td>${subKat}</td>
      <td>Rp ${m.harga.toLocaleString('id-ID')}</td>
      <td>
        <button class="btn-warning" onclick="editMenu(${m.id})">Edit</button>
        <button class="btn-danger" onclick="hapusMenu(${m.id})">Hapus</button>
      </td>
    </tr>
  `}).join('');
}

function tambahMenu() {
  const nama = document.getElementById('namaMenu').value.trim();
  let hargaStr = document.getElementById('hargaMenu').value.replace(/\./g, '');
  const harga = parseInt(hargaStr);
  const tipe = document.getElementById('tipeMenu').value;
  const subKategori = document.getElementById('subKategoriMenu').value;

  if(!nama || isNaN(harga)) return alert('Lengkapi data dengan benar!');

  data.menu.push({id: Date.now(), nama, harga, tipe, subKategori});
  save();
  filterMenu(filterAktif);
  document.getElementById('namaMenu').value = '';
  document.getElementById('hargaMenu').value = '';
}

function editMenu(id) {
  editId = id;
  const item = data.menu.find(m => m.id === id);
  if(!item) return;

  document.getElementById('editForm').classList.remove('hidden');
  document.getElementById('editNama').value = item.nama;
  document.getElementById('editHarga').value = item.harga;
  document.getElementById('editTipe').value = item.tipe || 'Food';
  document.getElementById('editSubKategori').value = item.subKategori || 'Makanan Berat';

  window.scrollTo(0, 0);
}

function simpanEdit() {
  if(editId === null) return;

  const nama = document.getElementById('editNama').value.trim();
  let hargaStr = document.getElementById('editHarga').value.replace(/\./g, '');
  const harga = parseInt(hargaStr);
  const tipe = document.getElementById('editTipe').value;
  const subKategori = document.getElementById('editSubKategori').value;

  if(!nama || isNaN(harga)) return alert('Lengkapi data dengan benar!');

  const index = data.menu.findIndex(m => m.id === editId);
  if(index!== -1) {
    data.menu[index] = {id: editId, nama, harga, tipe, subKategori};
    save();
    filterMenu(filterAktif);
    batalEdit();
    alert('Data berhasil diupdate!');
  }
}

function batalEdit() {
  editId = null;
  document.getElementById('editForm').classList.add('hidden');
  document.getElementById('editNama').value = '';
  document.getElementById('editHarga').value = '';
}

function hapusMenu(id) {
  if(!confirm('Hapus menu ini?')) return;
  data.menu = data.menu.filter(m => m.id!== id);
  save();
  filterMenu(filterAktif);
}

// ===== KASIR MODULE =====
function renderKasir() {
  const container = document.getElementById('kasir');
  container.innerHTML = `
    <div class="card">
      <h2>💰 Kasir</h2>
      <p>Fitur kasir akan menampilkan daftar transaksi aktif.</p>
      <table>
        <thead>
          <tr><th>No</th><th>Tanggal</th><th>Total</th><th>Status</th></tr>
        </thead>
        <tbody id="listTransaksi"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('listTransaksi');
  if(data.transaksi.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center">Belum ada transaksi</td></tr>`;
    return;
  }
  tbody.innerHTML = data.transaksi.map((t, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${new Date(t.tanggal).toLocaleString('id-ID')}</td>
      <td>Rp ${t.total.toLocaleString('id-ID')}</td>
      <td>${t.status}</td>
    </tr>
  `).join('');
}

// ===== LAPORAN MODULE =====
function renderLaporan() {
  const total = data.transaksi.reduce((sum, t) => sum + t.total, 0);
  const container = document.getElementById('laporan');
  container.innerHTML = `
    <div class="card">
      <h2>📊 Laporan Penjualan</h2>
      <h3>Total Pendapatan: Rp ${total.toLocaleString('id-ID')}</h3>
      <table>
        <thead>
          <tr><th>No</th><th>Tanggal</th><th>Total</th></tr>
        </thead>
        <tbody id="listLaporan"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('listLaporan');
  if(data.transaksi.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" class="text-center">Belum ada data</td></tr>`;
    return;
  }
  tbody.innerHTML = data.transaksi.map((t, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${new Date(t.tanggal).toLocaleString('id-ID')}</td>
      <td>Rp ${t.total.toLocaleString('id-ID')}</td>
    </tr>
  `).join('');
}

// ===== BACKUP MODULE =====
function renderBackup() {
  const container = document.getElementById('backup');
  container.innerHTML = `
    <div class="card">
      <h2>💾 Backup & Restore</h2>
      <div class="flex">
        <button class="btn-success" onclick="exportData()">Export Data</button>
        <input type="file" id="importFile" accept=".json" onchange="importData(event)">
      </div>
      <p style="margin-top:15px;">Data tersimpan otomatis di browser. Export untuk backup.</p>
    </div>
  `;
}

function exportData() {
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kasir-backup.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(event) {
    data = JSON.parse(event.target.result);
    save();
    alert('Data berhasil diimport!');
    location.reload();
  };
  reader.readAsText(file);
}

// Init
renderMeja();
</script>
</body>
</html>
