<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Sederhana</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h2 { text-align: center; }
   .container { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
    input, select, button { padding: 8px; margin: 5px 0; }
    button { cursor: pointer; border: none; border-radius: 5px; background: #4CAF50; color: white; }
    button:hover { background: #45a049; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
   .total-row { font-weight: bold; background: #f2f2f2; }
   .filter { margin: 15px 0; }
</style>
</head>
<body>
<div class="container">
    <h2>Kasir Sederhana</h2>

    <div>
        <h3>Input Penjualan</h3>
        <input type="text" id="namaItem" placeholder="Nama Item">
        <input type="number" id="hargaItem" placeholder="Harga" min="0">
        <input type="number" id="qtyItem" placeholder="Qty" min="1" value="1">
        <button onclick="tambahItem()">Tambah Item</button>
        <button onclick="simpanPenjualan()">Simpan Penjualan</button>
    </div>

    <table id="tabelKeranjang">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Harga</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <h3>Total: Rp<span id="totalKeranjang">0</span></h3>

    <hr>

    <h3>Laporan Penjualan</h3>
    <div class="filter">
        Dari: <input type="date" id="tglDari">
        Sampai: <input type="date" id="tglSampai">
        <button onclick="printLaporan()">Print Laporan</button>
    </div>

    <table id="tabelLaporan">
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Items</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let keranjang = [];
let penjualan = JSON.parse(localStorage.getItem('penjualan') || '[]');

function renderKeranjang() {
    let tbody = document.querySelector('#tabelKeranjang tbody');
    tbody.innerHTML = '';
    let total = 0;
    keranjang.forEach((item, i) => {
        let subtotal = item.harga * item.qty;
        total += subtotal;
        tbody.innerHTML += `
            <tr>
                <td>${item.nama}</td>
                <td>Rp${item.harga.toLocaleString('id-ID')}</td>
                <td>${item.qty}</td>
                <td>Rp${subtotal.toLocaleString('id-ID')}</td>
                <td><button onclick="hapusItem(${i})">Hapus</button></td>
            </tr>
        `;
    });
    document.getElementById('totalKeranjang').innerText = total.toLocaleString('id-ID');
}

function tambahItem() {
    let nama = document.getElementById('namaItem').value.trim();
    let harga = parseInt(document.getElementById('hargaItem').value);
    let qty = parseInt(document.getElementById('qtyItem').value);
    if (!nama ||!harga ||!qty) return alert('Isi semua field!');
    keranjang.push({nama, harga, qty});
    document.getElementById('namaItem').value = '';
    document.getElementById('hargaItem').value = '';
    document.getElementById('qtyItem').value = 1;
    renderKeranjang();
}

function hapusItem(i) {
    keranjang.splice(i, 1);
    renderKeranjang();
}

function simpanPenjualan() {
    if (keranjang.length === 0) return alert('Keranjang kosong!');
    let total = keranjang.reduce((sum, i) => sum + i.harga * i.qty, 0);
    let data = {
        tanggal: new Date().toLocaleString('id-ID'),
        items: keranjang,
        total: total
    };
    penjualan.push(data);
    localStorage.setItem('penjualan', JSON.stringify(penjualan));
    keranjang = [];
    renderKeranjang();
    renderLaporan();
    alert('Penjualan disimpan!');
}

function renderLaporan() {
    let tbody = document.querySelector('#tabelLaporan tbody');
    tbody.innerHTML = '';
    penjualan.forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td>${p.tanggal}</td>
                <td>${p.items.map(it => `${it.nama} x${it.qty}`).join(', ')}</td>
                <td>Rp${p.total.toLocaleString('id-ID')}</td>
            </tr>
        `;
    });
}

function printLaporan() {
    const dari = document.getElementById('tglDari').value;
    const sampai = document.getElementById('tglSampai').value;

    if(!dari ||!sampai) return alert('Pilih tanggal dulu');

    let dariDate = new Date(dari + 'T00:00:00');
    let sampaiDate = new Date(sampai + 'T23:59:59');

    let dataFilter = penjualan.filter(b => {
        let tglBill = new Date(b.tanggal.split('/').reverse().join('-'));
        if (isNaN(tglBill)) {
            let parts = b.tanggal.split(', ');
            if (parts.length === 2) {
                let tgl = parts[0].split('/');
                tglBill = new Date(tgl[2], tgl[1]-1, tgl[0]);
            }
        }
        return tglBill >= dariDate && tglBill <= sampaiDate;
    });

    if(dataFilter.length === 0) return alert('Tidak ada data di periode ini');

    let totalOmzet = dataFilter.reduce((sum, b) => sum + b.total, 0);

    let html = `
    <html>
    <head>
        <title>Laporan Penjualan ${dari} s/d ${sampai}</title>
        <style>
            body { font-family: Arial, sans-serif; font-size: 12px; padding: 20px; }
            h2 { text-align: center; margin-bottom: 5px; }
           .info { text-align: center; margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #000; padding: 6px; text-align: left; }
            th { background: #f2f2f2; }
           .total-row { font-weight: bold; background: #f2f2f2; }
            @media print { button { display: none; } }
        </style>
    </head>
    <body>
        <h2>LAPORAN PENJUALAN</h2>
        <div class="info">
            Periode: ${dari} s/d ${sampai}<br>
            Total Transaksi: ${dataFilter.length} | Omzet: Rp${totalOmzet.toLocaleString('id-ID')}
        </div>
        <table>
            <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Items</th>
                <th>Total</th>
            </tr>
    `;

    dataFilter.forEach((b, i) => {
        html += `
            <tr>
                <td>${i+1}</td>
                <td>${b.tanggal}</td>
                <td>${b.items.map(it => `${it.nama} x${it.qty}`).join(', ')}</td>
                <td>Rp${b.total.toLocaleString('id-ID')}</td>
            </tr>
        `;
    });

    html += `
            <tr class="total-row">
                <td colspan="3">TOTAL OMZET</td>
                <td>Rp${totalOmzet.toLocaleString('id-ID')}</td>
            </tr>
        </table>
        <br>
        <button onclick="window.print()">Print</button>
        <script>window.onload = function() { window.print(); }</script>
    </body>
    </html>
    `;

    let win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
}

renderLaporan();
</script>
</body>
</html>
