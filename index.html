<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir WARUNG MADE</title>
<style>
  :root {
    --primary: #4CAF50;
    --danger: #f44336;
    --warning: #ff9800;
    --dark: #333;
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #333;
    --border: #ddd;
    --info-bg: #e8f5e9;
  }

  /* Tema Pink */
  [data-theme="pink"] {
    --primary: #e91e63;
    --danger: #f44336;
    --warning: #ff9800;
    --dark: #880e4f;
    --bg: #fce4ec;
    --card: #ffffff;
    --text: #333;
    --border: #f8bbd0;
    --info-bg: #fce4ec;
  }

  /* Tema Black */
  [data-theme="black"] {
    --primary: #4CAF50;
    --danger: #f44336;
    --warning: #ff9800;
    --dark: #000;
    --bg: #121212;
    --card: #1e1e1e;
    --text: #ffffff;
    --border: #333;
    --info-bg: #2a2a2a;
  }

  /* Tema Green */
  [data-theme="green"] {
    --primary: #2e7d32;
    --danger: #d32f2f;
    --warning: #f57c00;
    --dark: #1b5e20;
    --bg: #e8f5e9;
    --card: #ffffff;
    --text: #1b5e20;
    --border: #a5d6a7;
    --info-bg: #c8e6c9;
  }

  /* Tema Coklat */
  [data-theme="brown"] {
    --primary: #8d6e63;
    --danger: #d32f2f;
    --warning: #ff9800;
    --dark: #3e2723;
    --bg: #efebe9;
    --card: #ffffff;
    --text: #3e2723;
    --border: #bcaaa4;
    --info-bg: #d7ccc8;
  }

  /* Tema Blue */
  [data-theme="blue"] {
    --primary: #2196F3;
    --danger: #f44336;
    --warning: #ff9800;
    --dark: #0d47a1;
    --bg: #e3f2fd;
    --card: #ffffff;
    --text: #0d47a1;
    --border: #90caf9;
    --info-bg: #bbdefb;
  }

    * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    color: var(--text);
    transition: 0.3s;
  }

 .navbar {
    background: var(--dark);
    padding: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
 .navbar button {
    background: #555;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.2s;
  }
 .navbar button.active,.navbar button:hover { background: var(--primary); }

 .theme-switcher {
    margin-left: auto;
    display: flex;
    gap: 5px;
    align-items: center;
  }
 .theme-btn {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 2px solid white;
    cursor: pointer;
    padding: 0;
  }
 .theme-btn[data-theme="pink"] { background: #e91e63; }
 .theme-btn[data-theme="black"] { background: #000; }
 .theme-btn[data-theme="green"] { background: #2e7d32; }
 .theme-btn[data-theme="brown"] { background: #8d6e63; }
 .theme-btn[data-theme="blue"] { background: #2196F3; }

 .container {
    max-width: 1100px;
    margin: 20px auto;
    background: var(--card);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: 0.3s;
  }
  h2 { text-align: center; margin-top: 0; color: var(--text); }

 .page { display: none; }
 .page.active { display: block; }

 .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
 .tab {
    padding: 10px 15px;
    background: var(--border);
    border-radius: 5px;
    cursor: pointer;
    transition: 0.2s;
  }
 .tab.active { background: var(--primary); color: white; }
 .meja { display: none; }
 .meja.active { display: block; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
  th { background: var(--border); }
  input, select, button, textarea {
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  select { min-width: 150px; }
  button {
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { opacity: 0.9; }
 .btn-danger { background: var(--danger); }
 .btn-warning { background: var(--warning); }
 .summary {
    margin-top: 15px;
    padding: 10px;
    background: var(--info-bg);
    border-radius: 5px;
  }

 .modal {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.5);
    z-index: 999;
  }
 .modal.active { display: flex; justify-content: center; align-items: center; }
 .modal-content {
    background: var(--card);
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 400px;
  }

 .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; color: white; }
 .badge.food { background: #2196F3; }
 .badge.beverage { background: #9C27B0; }
 .badge.snack { background: #ff9800; }
 .filter-bar { margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
 .action-btn { padding: 5px 8px; margin: 0 2px; font-size: 13px; }
 .info-meja {
    background: var(--info-bg);
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  @media (max-width: 768px) {
   .container { margin: 10px; padding: 15px; }
   .filter-bar { flex-direction: column; align-items: stretch; }
    input, select, button { width: 100%; }
   .theme-switcher { margin-left: 0; width: 100%; justify-content: center; }
  }
</style>
</head>
<body data-theme="green">

<div class="navbar">
  <button class="navbtn active" onclick="showPage('kasir', event)">Kasir</button>
  <button class="navbtn" onclick="showPage('meja', event)">Meja</button>
  <button class="navbtn" onclick="showPage('menu', event)">Menu</button>
  <button class="navbtn" onclick="showPage('laporan', event)">Laporan</button>
  <button class="navbtn" onclick="showPage('backup', event)">Backup</button>

  <div class="theme-switcher">
    <span style="color:white; font-size:12px;">Tema:</span>
    <button class="theme-btn" data-theme="pink" onclick="setTheme('pink')" title="Pink"></button>
    <button class="theme-btn" data-theme="black" onclick="setTheme('black')" title="Black"></button>
    <button class="theme-btn" data-theme="green" onclick="setTheme('green')" title="Green"></button>
    <button class="theme-btn" data-theme="brown" onclick="setTheme('brown')" title="Coklat"></button>
    <button class="theme-btn" data-theme="blue" onclick="setTheme('blue')" title="Blue"></button>
  </div>
</div>

<div class="container">
  <div id="kasir" class="page active">
    <h2>Kasir Warung Made</h2>
    <div class="tabs" id="tabs"></div>
    <div id="mejaContainer"></div>
  </div>

  <div id="meja" class="page">
    <h2>Manajemen Meja</h2>
    <div class="filter-bar">
      <input type="text" id="namaMejaBaru" placeholder="Nama Meja Baru">
      <button onclick="tambahMeja()">Tambah Meja</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Nama Meja</th><th>Kasir</th><th>Waitress</th><th>Aksi</th></tr></thead>
      <tbody id="tbodyMeja"></tbody>
    </table>
  </div>

  <div id="menu" class="page">
    <h2>Manajemen Menu</h2>
    <div class="filter-bar">
      <input type="text" id="namaMenu" placeholder="Nama Menu">
      <input type="number" id="hargaMenu" placeholder="Harga" min="0">
      <select id="kategoriMenu">
        <option value="Food">Food</option>
        <option value="Beverage">Beverage</option>
        <option value="Snack">Snack</option>
      </select>
      <button onclick="tambahMenu()">Tambah Menu</button>
    </div>

    <div class="filter-bar">
      <button onclick="filterMenu('All')">All</button>
      <button onclick="filterMenu('Food')">Food</button>
      <button onclick="filterMenu('Beverage')">Beverage</button>
      <button onclick="filterMenu('Snack')">Snack</button>
    </div>

    <table>
      <thead><tr><th>Menu</th><th>Kategori</th><th>Harga</th><th>Aksi</th></tr></thead>
      <tbody id="tbodyMenu"></tbody>
    </table>
  </div>

  <div id="laporan" class="page">
    <h2>Laporan Penjualan</h2>
    <div class="filter-bar">
      <label>Dari:</label>
      <input type="date" id="tglDari">
      <label>Sampai:</label>
      <input type="date" id="tglSampai">
      <button onclick="filterLaporan()">Tampilkan</button>
      <button class="btn-danger" onclick="hapusLaporan()">Hapus Data Periode</button>
      <button onclick="exportLaporanCSV()">Export CSV</button>
      <button onclick="printLaporan()">Print Laporan</button>
    </div>
    <div id="ringkasanLaporan" style="margin: 15px 0; font-weight: bold;"></div>
    <table>
      <thead>
        <tr>
          <th>Waktu</th><th>Meja</th><th>Kasir</th><th>Waitress</th><th>Item</th><th>Total</th>
        </tr>
      </thead>
      <tbody id="tbodyLaporan"></tbody>
    </table>
  </div>

  <div id="backup" class="page">
    <h2>Backup & Restore</h2>
    <button onclick="exportData()">Export Data</button>
    <button onclick="document.getElementById('fileImport').click()">Import Data</button>
    <input type="file" id="fileImport" style="display:none" accept=".json" onchange="importData(event)">
    <textarea id="backupArea" rows="12" style="width:100%; margin-top:10px;" readonly></textarea>
  </div>
</div>

<!-- Modal sama seperti sebelumnya, nggak aku ulang biar nggak kepanjangan -->
<div id="modalEditItem" class="modal">
  <div class="modal-content">
    <h3>Edit Item</h3>
    <input type="text" id="editNamaItem">
    <input type="number" id="editHargaItem">
    <input type="number" id="editQtyItem">
    <button onclick="simpanEditItem()">Simpan</button>
    <button class="btn-danger" onclick="tutupModal('modalEditItem')">Batal</button>
  </div>
</div>

<div id="modalEditMeja" class="modal">
  <div class="modal-content">
    <h3>Edit Meja</h3>
    <input type="text" id="editNamaMeja" placeholder="Nama Meja">
    <input type="text" id="editKasirMeja" placeholder="Nama Kasir">
    <input type="text" id="editWaitressMeja" placeholder="Nama Waitress">
    <button onclick="simpanEditMeja()">Simpan</button>
    <button class="btn-danger" onclick="tutupModal('modalEditMeja')">Batal</button>
  </div>
</div>

<div id="modalEditMenu" class="modal">
  <div class="modal-content">
    <h3>Edit Menu</h3>
    <input type="text" id="editNamaMenu">
    <input type="number" id="editHargaMenu">
    <select id="editKategoriMenu">
      <option value="Food">Food</option>
      <option value="Beverage">Beverage</option>
      <option value="Snack">Snack</option>
    </select>
    <button onclick="simpanEditMenu()">Simpan</button>
    <button class="btn-danger" onclick="tutupModal('modalEditMenu')">Batal</button>
  </div>
</div>

<script>
// Semua JS sama seperti versi sebelumnya, tinggal tambah 2 fungsi tema di bawah

let data = {
  mejaList: [
    {id: 1, nama: "Meja 1", kasir: "", waitress: "", items: [], diskonPersen: 0, ppnPersen: 10},
    {id: 2, nama: "Meja 2", kasir: "", waitress: "", items: [], diskonPersen: 0, ppnPersen: 10},
    {id: 3, nama: "Meja 3", kasir: "", waitress: "", items: [], diskonPersen: 0, ppnPersen: 10}
  ],
  menuList: [
    {id: 1, nama: "Nasi Goreng", harga: 15000, kategori: "Food"},
    {id: 2, nama: "Mie Goreng", harga: 13000, kategori: "Food"},
    {id: 3, nama: "Es Teh", harga: 5000, kategori: "Beverage"},
    {id: 4, nama: "Es Jeruk", harga: 7000, kategori: "Beverage"}
  ],
  laporan: [],
  tema: "green"
};

let editTarget = null;
let filterKategori = 'All';

function loadData() {
  let saved = localStorage.getItem('kasirWarungMade');
  if(saved) data = JSON.parse(saved);
  setTheme(data.tema || 'green');
}

function saveData() {
  localStorage.setItem('kasirWarungMade', JSON.stringify(data));
}

function setTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  data.tema = theme;
  saveData();
}

//... semua fungsi lainnya tetap sama seperti kode kamu sebelumnya...
// copy semua fungsi dari: showPage, init, renderTabs, showTab, renderMeja,
// tambahItem, cetakStruk, tambahMeja, renderMenuTable, filterLaporan, dll

// Singkatnya, paste semua fungsi JS kamu yang lama dari baris function showPage sampai bawah
// Aku cuma ubah bagian atas aja buat tema

function showPage(pageId, event) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  if(pageId === 'meja') renderMejaTable();
  if(pageId === 'menu') renderMenuTable();
  if(pageId === 'laporan') renderLaporan();
  if(pageId === 'backup') document.getElementById('backupArea').value = JSON.stringify(data, null, 2);
}

function init() {
  renderTabs();
  renderMeja();
  if(data.mejaList.length > 0) showTab(data.mejaList[0].id);
}

function renderTabs() {
  let tabsDiv = document.getElementById('tabs');
  tabsDiv.innerHTML = '';
  data.mejaList.forEach(meja => {
    let btn = document.createElement('div');
    btn.className = 'tab';
    btn.innerText = meja.nama;
    btn.onclick = () => showTab(meja.id);
    tabsDiv.appendChild(btn);
  });
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', data.mejaList[i].id === id);
  });
  document.querySelectorAll('.meja').forEach(el => el.classList.remove('active'));
  let target = document.getElementById('meja' + id);
  if(target) target.classList.add('active');
}

function renderMeja() {
  let container = document.getElementById('mejaContainer');
  container.innerHTML = '';
  data.mejaList.forEach(meja => {
    let div = document.createElement('div');
    div.id = 'meja' + meja.id;
    div.className = 'meja';

    let optionMenu = '<option value="">-- Pilih Menu --</option>';
    data.menuList.forEach(m => {
      optionMenu += `<option value="${m.id}">${m.nama} - Rp${m.harga.toLocaleString('id-ID')}</option>`;
    });

    div.innerHTML = `
      <div class="info-meja">
        <b>${meja.nama}</b> |
        Kasir: ${meja.kasir || '-'} |
        Waitress: ${meja.waitress || '-'}
        <button class="btn-warning action-btn" onclick="bukaEditMeja(${meja.id})">Edit</button>
      </div>

      <select id="selectMenu${meja.id}" onchange="pilihMenu(${meja.id})">${optionMenu}</select>
      <input type="text" id="nama${meja.id}" placeholder="Nama Menu" readonly>
      <input type="number" id="harga${meja.id}" placeholder="Harga" readonly>
      <input type="number" id="qty${meja.id}" placeholder="Qty" value="1" min="1">
      <button onclick="tambahItem(${meja.id})">Tambah</button>

      <table>
        <thead>
          <tr><th>Menu</th><th>Harga</th><th>Qty</th><th>Subtotal</th><th>Aksi</th></tr>
        </thead>
        <tbody id="tbody${meja.id}"></tbody>
      </table>

      <div class="summary">
        Diskon %: <input type="number" id="diskon${meja.id}" value="${meja.diskonPersen}" onchange="updateDiskon(${meja.id})" min="0" max="100">
        PPN %: <input type="number" id="ppn${meja.id}" value="${meja.ppnPersen}" onchange="updatePPN(${meja.id})" min="0" max="100">
        <div id="total${meja.id}"></div>
        <button onclick="cetakStruk(${meja.id})">Cetak & Simpan Bill</button>
        <button class="btn-danger" onclick="resetMeja(${meja.id})">Reset Meja</button>
      </div>
    `;
    container.appendChild(div);
    renderItems(meja.id);
  });
}

//... paste semua fungsi kamu yang lain di sini tanpa ubah...
// mulai dari function pilihMenu sampai function tutupModal

// Contoh fungsi yang penting:
function pilihMenu(mejaId) {
  let menuId = document.getElementById('selectMenu' + mejaId).value;
  if(!menuId) {
    document.getElementById('nama' + mejaId).value = '';
    document.getElementById('harga' + mejaId).value = '';
    return;
  }
  let menu = data.menuList.find(m => m.id == menuId);
  document.getElementById('nama' + mejaId).value = menu.nama;
  document.getElementById('harga' + mejaId).value = menu.harga;
}

function tambahItem(id) {
  let meja = data.mejaList.find(m => m.id === id);
  let nama = document.getElementById('nama' + id).value;
  let harga = parseFloat(document.getElementById('harga' + id).value);
  let qty = parseInt(document.getElementById('qty' + id).value);
  if(!nama || isNaN(harga) || isNaN(qty) || qty <= 0) return alert('Pilih menu dan isi qty dengan benar');

  let existing = meja.items.find(i => i.nama === nama);
  if(existing) {
    existing.qty += qty;
  } else {
    meja.items.push({nama, harga, qty});
  }

  saveData();
  renderItems(id);
  document.getElementById('selectMenu' + id).value = '';
  document.getElementById('nama' + id).value = '';
  document.getElementById('harga' + id).value = '';
  document.getElementById('qty' + id).value = '1';
}

function renderItems(id) {
  let meja = data.mejaList.find(m => m.id === id);
  let tbody = document.getElementById('tbody' + id);
  tbody.innerHTML = '';
  let subtotal = 0;
  meja.items.forEach((item, i) => {
    let sub = item.harga * item.qty;
    subtotal += sub;
    tbody.innerHTML += `
      <tr>
        <td>${item.nama}</td>
        <td>Rp${item.harga.toLocaleString('id-ID')}</td>
        <td>${item.qty}</td>
        <td>Rp${sub.toLocaleString('id-ID')}</td>
        <td>
          <button class="btn-warning action-btn" onclick="bukaEditItem(${id}, ${i})">Edit</button>
          <button class="btn-danger action-btn" onclick="hapusItem(${id}, ${i})">Hapus</button>
        </td>
      </tr>
    `;
  });
  hitungTotal(id, subtotal);
}

//... lanjutkan paste semua fungsi lainnya dari kode kamu...
// pastikan fungsi tutupModal ada di paling bawah

function tutupModal(id) {
  document.getElementById(id).classList.remove('active');
  editTarget = null;
}

loadData();
renderMeja();
init();
</script>
</body>
</html>
